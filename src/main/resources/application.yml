server:
  port: 8081

gg:
  jte:
    developmentMode: true
    templateLocation: src/main/resources/jte

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
            logger-level: full
          email-validation:
            connect-timeout: 3000
            read-timeout: 5000
    jackson:
      default-property-inclusion: non_null
      serialization:
        write-dates-as-timestamps: false
        indent-output: true
      deserialization:
        fail-on-unknown-properties: false
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: true
  application:
    name: crm
  jte:
    enabled: true
    content-type: text/html
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

resilience4j:
  retry:
    instances:
      email-validation:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - feign.RetryableException
        ignore-exceptions:
          - feign.FeignException.BadRequest  # 400 не retry
          - feign.FeignException.NotFound    # 404 не retry

  circuitbreaker:
    instances:
      email-validation:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  level:
    feign: DEBUG
    io.github.resilience4j: DEBUG

email:
  validation:
    base-url: ${EMAIL_VALIDATION_URL:http://localhost:8089}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha