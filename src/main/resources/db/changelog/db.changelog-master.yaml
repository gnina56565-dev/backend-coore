databaseChangeLog:
  - include:
      file: migrations/001_create_companies.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/002_create_leads.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/003_create_contacts.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/004_create_deals.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/005_create_products.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/006_create_deal_product.sql
      relativeToChangelogFile: true
  - include:
      file: migrations/007_create_employees.sql
      relativeToChangelogFile: true

  # Измененный changeSet без preConditions
  - changeSet:
      id: add-demo-data
      author: dev
      sqlFile:
        path: changes/demo-data.sql
        relativeToChangelogFile: true
        splitStatements: true
        stripComments: true
        endDelimiter: ;
